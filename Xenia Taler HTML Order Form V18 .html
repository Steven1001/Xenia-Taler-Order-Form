<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xenia Taler · Order Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #f5f1ea;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .order-card {
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 2rem 2rem 2.5rem;
      border: 1px solid #e8dfd3;
    }
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      border-bottom: 2px solid #d9c9b4;
      padding-bottom: 1.25rem;
    }
    .brand-header h1 {
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #2e241b;
    }
    .brand-header h1 span {
      font-weight: 300;
      font-size: 1.2rem;
      color: #7f6b57;
      margin-left: 10px;
    }
    .order-meta {
      display: flex;
      gap: 2rem;
      font-size: 0.95rem;
      color: #5a4a3a;
      background: #faf7f2;
      padding: 0.65rem 1.5rem;
      border-radius: 40px;
      align-items: center;
    }
    .order-meta .meta-item {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .order-meta .label {
      font-weight: 500;
      color: #9b8a77;
      white-space: nowrap;
    }
    .order-meta input.po-input {
      padding: 0.35rem 0.7rem;
      border: 1.5px solid #e2d8cc;
      border-radius: 20px;
      font-size: 0.9rem;
      background: #fefcf9;
      width: 200px;
      font-family: inherit;
      color: #2e241b;
    }
    .order-meta input.po-input:focus {
      outline: none;
      border-color: #b9a58b;
      background: white;
      box-shadow: 0 0 0 4px rgba(185, 165, 139, 0.15);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem 2rem;
      margin-bottom: 2.5rem;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .field-group label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #7b6b5a;
    }
    .field-group input {
      padding: 0.85rem 1rem;
      border: 1.5px solid #e2d8cc;
      border-radius: 20px;
      font-size: 0.95rem;
      background: #fefcf9;
      transition: 0.2s;
    }
    .field-group input:focus {
      outline: none;
      border-color: #b9a58b;
      background: white;
      box-shadow: 0 0 0 4px rgba(185, 165, 139, 0.15);
    }
    .items-section {
      margin: 2rem 0 1.5rem;
    }
    .items-section h2 {
      font-size: 1.3rem;
      font-weight: 500;
      color: #3f3327;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .items-section h2::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #e3d8cc, transparent);
    }
    .item-row {
      display: grid;
      grid-template-columns: 1.3fr 1.1fr 1fr 0.8fr 0.7fr 0.9fr 38px 38px;
      gap: 0.7rem;
      align-items: center;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid #f0e9e1;
      font-size: 0.92rem;
      transition: background 0.12s;
      border-radius: 8px;
    }
    .item-row:not(.header-row):hover {
      background: #fbf8f3;
    }
    .item-row.header-row {
      font-weight: 600;
      color: #806e5b;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #e3d8cc;
      padding-bottom: 0.5rem;
    }
    .item-row.header-row .actions-header {
      grid-column: span 2;
      text-align: center;
    }
    .item-row.header-row:hover { background: transparent; }
    .item-row input,
    .item-row select {
      padding: 0.55rem 0.7rem;
      border: 1px solid #e2d8cc;
      border-radius: 14px;
      font-size: 0.9rem;
      background: #fefcf9;
      width: 100%;
      font-family: inherit;
    }
    .item-row input:focus,
    .item-row select:focus {
      outline: none;
      border-color: #b9a58b;
      background: white;
    }
    .item-row .item-price,
    .item-row .item-subtotal {
      font-weight: 500;
      color: #2e241b;
    }
    .row-btn {
      background: #fefcf9;
      border: 1px solid #e2d8cc;
      cursor: pointer;
      padding: 0;
      border-radius: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      transition: 0.15s;
      color: #7b6b5a;
    }
    .row-btn:hover { background: #f5ede5; border-color: #b9a58b; }
    .row-btn.dup-btn:hover { color: #4f6146; border-color: #6d7f62; background: #eaf0e5; }
    .row-btn.remove-btn { color: #b85c3a; }
    .row-btn.remove-btn:hover { background: #fae8e2; border-color: #b85c3a; color: #a14020; }
    .empty-message {
      padding: 1.5rem 1rem;
      text-align: center;
      color: #9b8a77;
      font-size: 0.95rem;
      border: 1px dashed #e3d8cc;
      border-radius: 16px;
      margin-top: 0.5rem;
    }
    .add-product-bar {
      display: flex;
      justify-content: flex-start;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .total-summary {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 2px dashed #d9c9b4;
    }
    .total-box {
      background: #faf7f2;
      padding: 1rem 2rem;
      border-radius: 24px;
      min-width: 260px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
    }
    .total-box .label { font-weight: 400; color: #7f6b57; }
    .total-box .amount {
      font-weight: 600;
      color: #2e241b;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
    }
    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.9rem 2rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: white;
      color: #3f3327;
      border: 1.5px solid #d9c9b4;
    }
    button:hover { background: #f5ede5; border-color: #b9a58b; }
    button.primary {
      background: #2e241b;
      color: white;
      border: 1.5px solid #2e241b;
    }
    button.primary:hover { background: #4a3a2e; }
    button.small { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
    button:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #7b6b5a;
      text-align: right;
      min-height: 1.5rem;
    }
    .warning { color: #b85c3a; font-weight: 500; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(46, 36, 27, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
      border: 1px solid #e8dfd3;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 {
      font-size: 1.3rem;
      font-weight: 500;
      color: #2e241b;
      margin-bottom: 1.25rem;
    }
    .modal .field-group { margin-bottom: 1rem; }
    .modal .field-group label { display: block; margin-bottom: 0.35rem; }
    .modal .field-group input,
    .modal .field-group select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid #e2d8cc;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #fefcf9;
      font-family: inherit;
      color: #2e241b;
    }
    .modal .field-group input:focus,
    .modal .field-group select:focus {
      outline: none;
      border-color: #b9a58b;
      background: white;
      box-shadow: 0 0 0 4px rgba(185, 165, 139, 0.15);
    }
    .modal .field-group input.invalid,
    .modal .field-group select.invalid {
      border-color: #b85c3a;
      background: #fdf1ee;
    }
    .modal .field-group input[readonly] {
      background: #f4eee7;
      color: #5a4a3a;
      cursor: default;
    }
    .modal .hint {
      font-size: 0.78rem;
      color: #9b8a77;
      margin-top: 0.3rem;
    }
    .modal .modal-error {
      font-size: 0.85rem;
      color: #b85c3a;
      min-height: 1.2rem;
      margin-top: 0.25rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      background: #f7f2ec;
      padding: 0.35rem;
      border-radius: 40px;
    }
    .mode-toggle button {
      flex: 1;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      border-radius: 40px;
      border: none;
      background: transparent;
      color: #7b6b5a;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .mode-toggle button.active {
      background: white;
      color: #2e241b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .custom-fields.hidden,
    .preset-fields.hidden { display: none; }
    @media (max-width: 900px) {
      .item-row { grid-template-columns: 1.2fr 1fr 1fr 0.8fr 0.6fr 0.9fr 34px 34px; gap: 0.35rem; font-size: 0.82rem; }
    }
    @media (max-width: 800px) {
      .order-card { padding: 1.5rem; }
      .form-grid { grid-template-columns: 1fr; gap: 1rem; }
      .order-meta { flex-wrap: wrap; gap: 1rem; }
      .order-meta input.po-input { width: 160px; }
    }
  </style>
</head>
<body>
  <div class="order-card" id="orderCard">
    <div class="brand-header">
      <h1>XENIA TALER <span>order tool</span></h1>
      <div class="order-meta">
        <div class="meta-item">
          <span class="label">PO #</span>
          <input type="text" id="poNumber" class="po-input" placeholder="XT-20251126-001" title="Editable PO number">
        </div>
        <div class="meta-item">
          <span class="label">Date</span>
          <span id="orderDate">—</span>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field-group">
        <label>Customer name</label>
        <input type="text" id="customerName" placeholder="e.g. Maria Lang">
      </div>
      <div class="field-group">
        <label>Email address</label>
        <input type="email" id="customerEmail" placeholder="customer@example.com">
      </div>
      <div class="field-group">
        <label>Shipping address</label>
        <input type="text" id="customerAddress" placeholder="Street, city, postal code">
      </div>
      <div class="field-group">
        <label>Phone (optional)</label>
        <input type="text" id="customerPhone" placeholder="+1 (555) 123-4567">
      </div>
    </div>

    <div class="items-section">
      <h2>Order items</h2>
      <div class="item-row header-row">
        <div>Type</div>
        <div>SKU</div>
        <div>Variant</div>
        <div>Price</div>
        <div>Qty</div>
        <div>Subtotal</div>
        <div class="actions-header">Actions</div>
      </div>
      <div id="itemsContainer"></div>
      <div class="add-product-bar">
        <button id="addProductBtn" class="small">+ Add product</button>
        <button id="duplicateLastBtn" class="small" title="Duplicate the last line item">⧉ Duplicate last item</button>
      </div>
    </div>

    <div class="total-summary">
      <div class="total-box">
        <span class="label">Total</span>
        <span class="amount" id="totalAmount">$0.00</span>
      </div>
    </div>

    <div class="action-bar">
      <button id="resetBtn">Reset</button>
      <button id="previewPdfBtn" class="primary">Generate PDF & preview</button>
      <button id="emailPdfBtn" class="primary">Email PDF</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="modal-overlay hidden" id="productModal">
    <div class="modal">
      <h3>Add a product</h3>
      <div class="mode-toggle">
        <button id="modePreset" class="active" type="button">Choose from catalog</button>
        <button id="modeCustom" type="button">Custom product</button>
      </div>

      <div class="preset-fields" id="presetFields">
        <div class="field-group">
          <label>1 · Product type</label>
          <select id="presetType"></select>
        </div>
        <div class="field-group">
          <label>2 · SKU</label>
          <select id="presetSku"></select>
          <div class="hint">Each SKU represents a specific item within the product type.</div>
        </div>
        <div class="field-group">
          <label>3 · Variant</label>
          <select id="presetVariant"></select>
          <div class="hint">Color / finish option for the selected SKU.</div>
        </div>
        <div class="field-group">
          <label>4 · Price</label>
          <input type="text" id="presetPrice" readonly>
        </div>
      </div>

      <div class="custom-fields hidden" id="customFields">
        <div class="field-group">
          <label>Product type</label>
          <input type="text" id="newProductType" placeholder="e.g. Mug">
        </div>
        <div class="field-group">
          <label>SKU</label>
          <input type="text" id="newProductSku" placeholder="e.g. TM-SAND-01">
        </div>
        <div class="field-group">
          <label>Variant</label>
          <input type="text" id="newProductVariant" placeholder="e.g. Sand">
        </div>
        <div class="field-group">
          <label>Price (per unit)</label>
          <input type="number" id="newProductPrice" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>

      <div class="modal-error" id="modalError"></div>
      <div class="modal-actions">
        <button id="cancelAddProduct" type="button">Cancel</button>
        <button id="confirmAddProduct" class="primary" type="button">Add product</button>
      </div>
    </div>
  </div>

      // ---------- PO NUMBER ----------
      const PO_LS_KEY = 'xt_po_seq_v2';
      function todayCompact() {
        const t = new Date();
        const y = t.getFullYear();
        const m = String(t.getMonth() + 1).padStart(2, '0');
        const d = String(t.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
      }
      function readPoState() {
        try {
          const raw = localStorage.getItem(PO_LS_KEY);
          if (!raw) return { date: null, seq: 0 };
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return { date: null, seq: 0 };
          return { date: parsed.date || null, seq: Number(parsed.seq) || 0 };
        } catch (e) { return { date: null, seq: 0 }; }
      }
      function writePoState(date, seq) {
        localStorage.setItem(PO_LS_KEY, JSON.stringify({ date, seq }));
      }
      function formatPo(dateStr, seq) {
        return `XT-${dateStr}-${String(seq).padStart(3, '0')}`;
      }
      function initializePoOnLoad() {
        const today = todayCompact();
        const state = readPoState();
        if (state.date !== today) {
          writePoState(today, 1);
          poNumberInput.value = formatPo(today, 1);
        } else {
          const seq = state.seq > 0 ? state.seq : 1;
          if (seq !== state.seq) writePoState(today, seq);
          poNumberInput.value = formatPo(today, seq);
        }
      }
      function incrementPoOnReset() {
        const today = todayCompact();
        const state = readPoState();
        if (state.date !== today) {
          writePoState(today, 2);
          poNumberInput.value = formatPo(today, 2);
          return;
        }
        let seq = state.seq + 1;
        if (seq > 999) seq = 1;
        writePoState(today, seq);
        poNumberInput.value = formatPo(today, seq);
      }

      function setOrderDate() {
        const today = new Date();
        orderDateSpan.textContent = today.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function formatMoney(amount) { return '$' + amount.toFixed(2); }

      const DUP_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      const TRASH_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

      function renderItems() {
        const isEmpty = products.length === 0;
        if (duplicateLastBtn) duplicateLastBtn.disabled = isEmpty;

        if (isEmpty) {
          itemsContainer.innerHTML = '<div class="empty-message">No products yet. Click “+ Add product” below to start building the order.</div>';
          totalAmountSpan.textContent = formatMoney(0);
          return;
        }

        let html = '';
        products.forEach((p, index) => {
          const qty = quantities[index] || 0;
          const subtotal = p.price * qty;

          const map = (p.variantMap && p.variantMap.length) ? p.variantMap : null;
          const optionsSource = map
            ? map.map(x => x.variant)
            : (p.variants && p.variants.length ? p.variants : [p.variant || '—']);

          const variantOptions = optionsSource
            .map((v, i) => {
              const sel = (v === p.variant) ? 'selected' : '';
              return `<option value="${i}" ${sel}>${v}</option>`;
            })
            .join('');

          html += `
            <div class="item-row" data-index="${index}">
              <div class="item-type">${p.type}</div>
              <div class="item-sku" title="${p.skuLabel || ''}">${p.sku}</div>
              <div>
                <select class="variant-select" data-index="${index}">
                  ${variantOptions}
                </select>
              </div>
              <div class="item-price">${formatMoney(p.price)}</div>
              <div>
                <input type="number" min="0" step="1" value="${qty}" class="qty-input" data-index="${index}">
              </div>
              <div class="item-subtotal">${formatMoney(subtotal)}</div>
              <button class="row-btn dup-btn" data-index="${index}" title="Duplicate this line below" aria-label="Duplicate ${p.type} ${p.sku}">${DUP_ICON}</button>
              <button class="row-btn remove-btn" data-index="${index}" title="Delete this item" aria-label="Delete ${p.type} ${p.sku}">${TRASH_ICON}</button>
            </div>
          `;
        });
        itemsContainer.innerHTML = html;

        document.querySelectorAll('.qty-input').forEach(input => {
          input.addEventListener('input', function() {
            const idx = parseInt(this.dataset.index, 10);
            let val = parseInt(this.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            quantities[idx] = val;
            updateSubtotalsAndTotal();
          });
          input.addEventListener('blur', function() {
            const idx = parseInt(this.dataset.index, 10);
            let val = parseInt(this.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            this.value = val;
            quantities[idx] = val;
            updateSubtotalsAndTotal();
          });
        });

        document.querySelectorAll('.variant-select').forEach(select => {
          select.addEventListener('change', function() {
            const idx = parseInt(this.dataset.index, 10);
            const optIdx = parseInt(this.value, 10);
            const p = products[idx];
            if (!p) return;

            const map = (p.variantMap && p.variantMap.length) ? p.variantMap : null;
            if (map && map[optIdx]) {
              const entry = map[optIdx];
              p.variant = entry.variant;
              p.sku = entry.sku;
              p.skuLabel = entry.skuLabel;
              p.price = entry.price;
            } else if (p.variants && p.variants[optIdx] !== undefined) {
              p.variant = p.variants[optIdx];
            }

            const row = document.querySelector(`.item-row[data-index="${idx}"]`);
            if (row) {
              const skuCell = row.querySelector('.item-sku');
              if (skuCell) {
                skuCell.textContent = p.sku;
                skuCell.title = p.skuLabel || '';
              }
              const priceCell = row.querySelector('.item-price');
              if (priceCell) priceCell.textContent = formatMoney(p.price);
            }
            updateSubtotalsAndTotal();
          });
        });

        document.querySelectorAll('.dup-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index, 10);
            duplicateProduct(idx);
          });
        });

        document.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index, 10);
            removeProduct(idx);
          });
        });

        updateSubtotalsAndTotal();
      }

      function updateSubtotalsAndTotal() {
        let total = 0;
        products.forEach((p, i) => {
          const qty = quantities[i] || 0;
          total += p.price * qty;
          const row = document.querySelector(`.item-row[data-index="${i}"]`);
          if (row) {
            const s = row.querySelector('.item-subtotal');
            if (s) s.textContent = formatMoney(p.price * qty);
          }
        });
        totalAmountSpan.textContent = formatMoney(total);
      }

      function getTotal() {
        return products.reduce((acc, p, i) => acc + p.price * (quantities[i] || 0), 0);
      }

      function addProduct(product) {
        products.push(product);
        quantities.push(0);
        renderItems();
      }

      function duplicateProduct(index) {
        const src = products[index];
        if (!src) return;

        const copy = {
          type: src.type,
          sku: src.sku,
          skuLabel: src.skuLabel,
          variants: [...src.variants],
          variant: src.variant,
          price: src.price,
          variantMap: src.variantMap ? src.variantMap.map(x => ({ ...x })) : []
        };

        products.splice(index + 1, 0, copy);
        quantities.splice(index + 1, 0, quantities[index] || 0);
        renderItems();
        statusMsg.textContent = `Duplicated ${src.sku} (${src.variant}) below.`;
      }

      function removeProduct(index) {
        const p = products[index];
        products.splice(index, 1);
        quantities.splice(index, 1);
        renderItems();
        if (p) statusMsg.textContent = `Deleted ${p.sku} (${p.variant}).`;
      }

      function resetForm() {
        products = [];
        quantities = [];
        customerNameInput.value = '';
        customerEmailInput.value = '';
        customerAddressInput.value = '';
        customerPhoneInput.value = '';
        renderItems();
        setOrderDate();
        incrementPoOnReset();
        statusMsg.textContent = 'Form cleared. PO advanced to ' + poNumberInput.value + '.';
      }

      function getOrderData() {
        const items = [];
        products.forEach((p, idx) => {
          const qty = quantities[idx] || 0;
          if (qty > 0) {
            items.push({
              type: p.type,
              sku: p.sku,
              skuLabel: p.skuLabel || '',
              variant: p.variant || '—',
              price: p.price,
              quantity: qty,
              subtotal: p.price * qty
            });
          }
        });
        return {
          customerName: customerNameInput.value.trim() || '—',
          customerEmail: customerEmailInput.value.trim() || '—',
          customerAddress: customerAddressInput.value.trim() || '—',
          customerPhone: customerPhoneInput.value.trim() || '',
          poNumber: poNumberInput.value.trim() || '—',
          orderDate: orderDateSpan.textContent,
          items,
          total: getTotal()
        };
      }

      async function generatePdfBlob() {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        const order = getOrderData();
        const pdfDoc = await PDFDocument.create();
        const page = pdfDoc.addPage([600, 780]);
        const { width, height } = page.getSize();
        const fReg = await pdfDoc.embedFont(StandardFonts.Helvetica);
        const fBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
        const fLite = await pdfDoc.embedFont(StandardFonts.Helvetica);

        const drawText = (text, x, y, size, font = fReg, color = rgb(0.2, 0.15, 0.1)) => {
          page.drawText(String(text), { x, y, size, font, color });
        };

        page.drawRectangle({ x: 40, y: height - 100, width: width - 80, height: 60, color: rgb(0.97, 0.95, 0.93) });
        drawText('XENIA TALER', 50, height - 80, 28, fBold, rgb(0.18, 0.14, 0.1));
        drawText('ORDER SUMMARY', 50, height - 105, 10, fLite, rgb(0.5, 0.4, 0.35));
        drawText(`PO #: ${order.poNumber}`, 400, height - 70, 9, fReg);
        drawText(`Date: ${order.orderDate}`, 400, height - 85, 9, fReg);

        let y = height - 150;
        drawText('CUSTOMER', 50, y, 10, fBold, rgb(0.5, 0.4, 0.35));
        y -= 20;
        drawText(order.customerName, 50, y, 12, fReg);
        y -= 18;
        drawText(order.customerEmail, 50, y, 9, fReg);
        y -= 16;
        drawText(order.customerAddress, 50, y, 9, fReg);
        if (order.customerPhone) {
          y -= 16;
          drawText(`Phone: ${order.customerPhone}`, 50, y, 9, fReg);
        }

        y -= 40;
        page.drawLine({ start: { x: 50, y }, end: { x: width - 50, y }, thickness: 1.5, color: rgb(0.85, 0.8, 0.75) });
        y -= 18;
        drawText('TYPE', 50, y, 9, fBold);
        drawText('SKU', 150, y, 9, fBold);
        drawText('VARIANT', 250, y, 9, fBold);
        drawText('PRICE', 380, y, 9, fBold);
        drawText('QTY', 440, y, 9, fBold);
        drawText('SUBTOTAL', 490, y, 9, fBold);
        y -= 12;
        page.drawLine({ start: { x: 50, y }, end: { x: width - 50, y }, thickness: 0.5, color: rgb(0.9, 0.85, 0.8) });

        if (order.items.length === 0) {
          y -= 25;
          drawText('No items selected', 50, y, 11, fLite, rgb(0.6, 0.5, 0.4));
        } else {
          y -= 22;
          order.items.forEach((item) => {
            const trunc = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + '…' : (s || ''));
            drawText(trunc(item.type, 16), 50, y, 9, fReg);
            drawText(trunc(item.sku, 14), 150, y, 9, fReg);
            drawText(trunc(item.variant, 24), 250, y, 9, fLite, rgb(0.4, 0.33, 0.28));
            drawText(formatMoney(item.price), 380, y, 9, fReg);
            drawText(String(item.quantity), 445, y, 9, fReg);
            drawText(formatMoney(item.subtotal), 490, y, 9, fReg);
            y -= 18;
          });
        }

        y -= 10;
        page.drawLine({ start: { x: 50, y }, end: { x: width - 50, y }, thickness: 1.5, color: rgb(0.85, 0.8, 0.75) });
        y -= 30;
        drawText('TOTAL', 390, y, 12, fBold);
        drawText(formatMoney(order.total), 490, y, 14, fBold, rgb(0.18, 0.14, 0.1));

        y -= 50;
        drawText('Thank you for your order.', 50, y, 9, fLite, rgb(0.5, 0.4, 0.35));
        drawText('Xenia Taler · hello@xeniatelier.com', 50, y - 15, 8, fLite, rgb(0.6, 0.55, 0.5));

        const bytes = await pdfDoc.save();
        return new Blob([bytes], { type: 'application/pdf' });
      }

      async function previewPdf() {
        try {
          statusMsg.textContent = 'Generating PDF…';
          const blob = await generatePdfBlob();
          const url = URL.createObjectURL(blob);
          window.open(url, '_blank');
          statusMsg.textContent = 'PDF opened in new tab.';
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        } catch (err) {
          console.error(err);
          statusMsg.innerHTML = '<span class="warning">Error generating PDF: ' + err.message + '</span>';
        }
      }

      async function emailPdf() {
        try {
          statusMsg.textContent = 'Preparing email…';
          const blob = await generatePdfBlob();
          const order = getOrderData();
          const subject = `Xenia Taler order ${order.poNumber} – ${order.customerName}`;
          const body = `Dear ${order.customerName},\n\nPlease find your order summary attached.\nPO #: ${order.poNumber}\nTotal: ${formatMoney(order.total)}\n\nBest regards,\nXenia Taler`;

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `xenia-order-${order.poNumber.replace(/[^\w-]/g, '_')}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 10000);

          window.location.href = `mailto:${encodeURIComponent(order.customerEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
          statusMsg.textContent = 'PDF downloaded. Email client opened — please attach the PDF.';
        } catch (err) {
          console.error(err);
          statusMsg.innerHTML = '<span class="warning">Error: ' + err.message + '</span>';
        }
      }

      const typeKeys = Object.keys(CATALOG);

      function populateTypes() {
        presetType.innerHTML = typeKeys.map(t => `<option value="${t}">${t}</option>`).join('');
      }
      function populateSkus(type) {
        const typeEntry = CATALOG[type];
        if (!typeEntry) { presetSku.innerHTML = '<option value="">—</option>'; return; }
        presetSku.innerHTML = typeEntry.skus
          .map((s, i) => `<option value="${i}">${s.label} (${s.sku})</option>`)
          .join('');
      }
      function populateVariantsAndPrice(type, skuIdx) {
        const typeEntry = CATALOG[type];
        if (!typeEntry) return;
        const sku = typeEntry.skus[skuIdx];
        if (!sku) return;
        const vars = sku.variants && sku.variants.length ? sku.variants : ['—'];
        presetVariant.innerHTML = vars.map((v, i) => `<option value="${i}">${v}</option>`).join('');
        presetPrice.value = formatMoney(sku.price);
      }
      function onTypeChange() {
        populateSkus(presetType.value);
        presetSku.selectedIndex = 0;
        onSkuChange();
      }
      function onSkuChange() {
        populateVariantsAndPrice(presetType.value, parseInt(presetSku.value, 10) || 0);
      }

      function setMode(mode) {
        currentMode = mode;
        modalError.textContent = '';
        [presetType, presetSku, presetVariant, newProductType, newProductSku, newProductVariant, newProductPrice]
          .forEach(el => el.classList.remove('invalid'));
        if (mode === 'preset') {
          modePresetBtn.classList.add('active');
          modeCustomBtn.classList.remove('active');
          presetFields.classList.remove('hidden');
          customFields.classList.add('hidden');
        } else {
          modeCustomBtn.classList.add('active');
          modePresetBtn.classList.remove('active');
          customFields.classList.remove('hidden');
          presetFields.classList.add('hidden');
        }
      }

      function openProductModal() {
        newProductType.value = '';
        newProductSku.value = '';
        newProductVariant.value = '';
        newProductPrice.value = '';
        modalError.textContent = '';

        populateTypes();
        presetType.selectedIndex = 0;
        onTypeChange();

        setMode('preset');
        productModal.classList.remove('hidden');
        setTimeout(() => {
          if (currentMode === 'preset') presetType.focus();
          else newProductType.focus();
        }, 0);
      }

      function closeProductModal() {
        productModal.classList.add('hidden');
      }

      function confirmAddProduct() {
        modalError.textContent = '';
        [presetType, presetSku, presetVariant, newProductType, newProductSku, newProductVariant, newProductPrice]
          .forEach(el => el.classList.remove('invalid'));

        if (currentMode === 'preset') {
          const type = presetType.value;
          const typeEntry = CATALOG[type];
          if (!typeEntry) {
            modalError.textContent = 'Please choose a product type.';
            presetType.classList.add('invalid');
            return;
          }
          const sku = typeEntry.skus[parseInt(presetSku.value, 10)];
          if (!sku) {
            modalError.textContent = 'Please choose a SKU.';
            presetSku.classList.add('invalid');
            return;
          }
          const variants = sku.variants && sku.variants.length ? sku.variants : ['—'];
          const chosenVariant = variants[parseInt(presetVariant.value, 10) || 0] || variants[0];

          const variantMap = [];
          typeEntry.skus.forEach(s => {
            const vars = (s.variants && s.variants.length) ? s.variants : ['—'];
            vars.forEach(v => {
              variantMap.push({
                variant: v,
                sku: s.sku,
                skuLabel: s.label,
                price: s.price
              });
            });
          });

          addProduct({
            type,
            sku: sku.sku,
            skuLabel: sku.label,
            variants,
            variant: chosenVariant,
            price: sku.price,
            variantMap
          });
          closeProductModal();
          statusMsg.textContent = `Added ${type} · ${sku.sku} (${chosenVariant}).`;
          return;
        }

        const type = newProductType.value.trim();
        const sku = newProductSku.value.trim();
        const variant = newProductVariant.value.trim();
        const priceRaw = newProductPrice.value.trim();

        if (!type) { modalError.textContent = 'Please enter a product type.'; newProductType.classList.add('invalid'); newProductType.focus(); return; }
        if (!sku) { modalError.textContent = 'Please enter a SKU.'; newProductSku.classList.add('invalid'); newProductSku.focus(); return; }
        const price = parseFloat(priceRaw);
        if (isNaN(price) || price < 0) { modalError.textContent = 'Please enter a valid price (0 or greater).'; newProductPrice.classList.add('invalid'); newProductPrice.focus(); return; }

        const v = variant || '—';
        addProduct({
          type,
          sku,
          skuLabel: sku,
          variants: [v],
          variant: v,
          price,
          variantMap: [{ variant: v, sku, skuLabel: sku, price }]
        });
        closeProductModal();
        statusMsg.textContent = `Added ${type} · ${sku}.`;
      }

      function init() {
        setOrderDate();
        initializePoOnLoad();
        renderItems();

        document.getElementById('resetBtn').addEventListener('click', resetForm);
        document.getElementById('previewPdfBtn').addEventListener('click', previewPdf);
        document.getElementById('emailPdfBtn').addEventListener('click', emailPdf);
        document.getElementById('addProductBtn').addEventListener('click', openProductModal);

        duplicateLastBtn.addEventListener('click', function() {
          if (products.length === 0) return;
          duplicateProduct(products.length - 1);
        });

        document.getElementById('cancelAddProduct').addEventListener('click', closeProductModal);
        document.getElementById('confirmAddProduct').addEventListener('click', confirmAddProduct);

        modePresetBtn.addEventListener('click', () => setMode('preset'));
        modeCustomBtn.addEventListener('click', () => setMode('custom'));

        presetType.addEventListener('change', onTypeChange);
        presetSku.addEventListener('change', onSkuChange);

        [presetType, presetSku, presetVariant, newProductType, newProductSku, newProductVariant, newProductPrice]
          .forEach(el => {
            el.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') { e.preventDefault(); confirmAddProduct(); }
            });
          });

        productModal.addEventListener('click', function(e) {
          if (e.target === productModal) closeProductModal();
        });
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && !productModal.classList.contains('hidden')) closeProductModal();
        });
      }

      init();
    })();
  </script>
</body>
</html>
